name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore OpenSkin.Client.sln
      - run: dotnet build OpenSkin.Client.sln --configuration Release --no-restore
      - run: dotnet pack src/OpenSkin.Client/OpenSkin.Client.csproj --configuration Release --no-build --output artifacts
