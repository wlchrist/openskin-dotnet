        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Job not found for this workspace
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Private result signing unavailable
      security:
      - PlatformAPIKey: []
      summary: Read an image request
      tags:
      - Platform v2 media
      x-openskin-availability: production
  /v2/renders/{render_id}/retry:
    post:
      description: "Retries a failed image request with the same item, saved settings,\
        \ and output settings."
      operationId: retryV2ImageRender
      parameters:
      - $ref: "#/components/parameters/V2RenderID"
      - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ImageRenderReceipt"
          description: Existing retry returned
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ImageRenderReceipt"
          description: Retry accepted
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Job not found for this workspace
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Job is not failed or idempotency key conflicts
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Image render queue unavailable
      security:
      - PlatformAPIKey: []
      summary: Retry a failed image request
      tags:
      - Platform v2 media
      x-openskin-availability: production
components:
  parameters:
    IdempotencyKey:
      explode: false
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 128
        minLength: 8
        type: string
      style: simple
    V2SteamID:
      description: "Public individual SteamID64, SteamID2, or SteamID3"
      explode: false
      in: path
      name: steam_id
      required: true
      schema:
        type: string
      style: simple
    V2AccountID:
      explode: false
      in: path
      name: account_id
      required: true
      schema:
        format: int64
        minimum: 1
        type: integer
      style: simple
    V2TradeIntentID:
      description: Workspace-owned customer-directed trade intent identifier
      explode: false
      in: path
      name: intent_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    V2WebhookEndpointID:
      explode: false
      in: path
      name: endpoint_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    V2SceneID:
      explode: false
      in: path
      name: scene_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
    V2SceneIfMatch:
      description: Quoted SHA-256 digest returned by the current scene ETag
      explode: false
      in: header
      name: If-Match
      required: true
      schema:
        pattern: "^\\\"[0-9a-f]{64}\\\"$"
        type: string
      style: simple
    V2RenderID:
      explode: false
      in: path
      name: render_id
      required: true
      schema:
        format: uuid
        type: string
      style: simple
  responses:
    V2Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2PlatformErrorResponse"
      description: "Missing, invalid, expired, or revoked Platform API key"
    V2Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2PlatformErrorResponse"
      description: "An active Platform subscription is required, and the API key must\
        \ grant every required scope"
    V2UsageUnavailable:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V2PlatformErrorResponse"
      description: "Usage tracking is unavailable, so metered requests are rejected\
        \ until accounting recovers."
  schemas:
    V2GetHealthResponse:
      example:
        status: ok
        api_version: v2
        contract_version: contract_version
        environment: production
      properties:
        status:
          enum:
          - ok
          type: string
        api_version:
          enum:
          - v2
          type: string
        contract_version:
          type: string
        environment:
          enum:
          - production
          - v2-test
          type: string
      required:
      - api_version
      - contract_version
      - environment
      - status
    V2OperationalStatusResponse:
      example:
        data:
          status: operational
          checked_at: 2000-01-23T04:56:07.000+00:00
          components:
          - name: data
            status: operational
            reason: reason
            advisory: true
            observed_at: 2000-01-23T04:56:07.000+00:00
          - name: data
            status: operational
            reason: reason
            advisory: true
            observed_at: 2000-01-23T04:56:07.000+00:00
          component_status:
            key: operational
      properties:
        data:
          $ref: "#/components/schemas/V2OperationalStatus"
      required:
      - data
    V2PlatformErrorResponse:
      example:
        error:
          code: code
          message: message
      properties:
        error:
          $ref: "#/components/schemas/V2PlatformErrorBody"
      required:
      - error
    V2ListCapabilitiesResponse:
      example:
        api_version: v2
        capabilities:
        - name: name
          state: production
          required_scopes:
          - required_scopes
          - required_scopes
          boundary: data
        - name: name
          state: production
          required_scopes:
          - required_scopes
          - required_scopes
          boundary: data
      properties:
        api_version:
          enum:
          - v2
          type: string
        capabilities:
          items:
            $ref: "#/components/schemas/V2Capability"
          type: array
          default: null
      required:
      - api_version
      - capabilities
    V2ListScopesResponse:
      example:
        api_version: v2
        scopes:
        - scopes
        - scopes
      properties:
        api_version:
          enum:
          - v2
          type: string
        scopes:
          items:
            type: string
          type: array
          uniqueItems: true
          default: null
      required:
      - api_version
      - scopes
    V2PrincipalResponse:
      example:
        api_version: v2
        tenant_id: 0
        key_id: 6
        tier: tier
        scopes:
        - scopes
        - scopes
      properties:
        api_version:
          enum:
          - v2
          type: string
        tenant_id:
          format: int64
          type: integer
        key_id:
          format: int64
          type: integer
        tier:
          type: string
        scopes:
          items:
            type: string
          type: array
          uniqueItems: true
          default: null
      required:
      - api_version
      - key_id
      - scopes
      - tenant_id
      - tier
    V2GetUsageResponse:
      example:
        data:
          day: 2000-01-23
          minute:
            used_units: 0
            limit: 0
            resets_at: 2000-01-23T04:56:07.000+00:00
          daily:
            used_units: 0
            limit: 0
            resets_at: 2000-01-23T04:56:07.000+00:00
          operations:
          - operation: operation
            requests: 0
            units: 0
            errors: 0
          - operation: operation
            requests: 0
            units: 0
            errors: 0
          source: valkey-live
          quota_scope: unlimited
          attribution_scope: api_key
      properties:
        data:
          $ref: "#/components/schemas/V2UsageSummary"
      required:
      - data
    V2ListAuditEventsResponse:
      example:
        data:
          events:
          - id: id
            source: platform
            event_type: event_type
            resource_type: resource_type
