  /v2/renders:
    get:
      description: Returns image requests for the current account in newest-first
        order.
      operationId: listV2ImageRenders
      parameters:
      - explode: true
        in: query
        name: state
        required: false
        schema:
          enum:
          - queued
          - leased
          - rendering
          - succeeded
          - failed
          - canceled
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
