          minItems: 2
          type: array
          uniqueItems: true
          default: null
        style: form
      - explode: true
        in: query
        name: methodology
        required: false
        schema:
          default: cs2.chain-equal-weight.v1
          enum:
          - cs2.chain-equal-weight.v1
          type: string
        style: form
      - explode: true
        in: query
        name: granularity
        required: false
        schema:
          default: daily
          enum:
          - daily
          - weekly
          - monthly
          type: string
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Maximum candles per series.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 365
          maximum: 500
          minimum: 1
          type: integer
        style: form
