openapi: 3.1.0
info:
  contact:
    email: hello@openskin.dev
  description: "Catalog, pricing, inventory, inspect, media, Steam profile, trading,\
    \ and webhook APIs for CS2 applications."
  title: OpenSkin Platform API
  version: 1.0.0
servers:
- description: Production
  url: https://api-v2.openskin.dev
paths:
  /v2/health:
    get:
      description: Returns the Platform v2 API process status.
      operationId: getV2Health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetHealthResponse"
          description: Platform v2 contract is served
      summary: Check Platform API health
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/status:
    get:
      description: "Returns health information for Platform data, caches, media, webhooks,\
        \ and Steam automation."
      operationId: getV2OperationalStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2OperationalStatusResponse"
          description: "Current aggregate Platform state, including degraded components"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Status service is not configured
      summary: Read Platform operational status
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/meta/capabilities:
    get:
      description: "Lists each Platform feature as production, unavailable, or planned,\
        \ together with the API-key scopes it requires."
      operationId: listV2Capabilities
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ListCapabilitiesResponse"
          description: Current feature availability and required scopes
      summary: List Platform feature availability
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/meta/scopes:
    get:
      description: Returns every recognized scope in stable documentation order.
      operationId: listV2Scopes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ListScopesResponse"
          description: Recognized Platform scopes
      summary: List Platform API-key scopes
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/me:
    get:
      description: "Authenticates the API key and returns its workspace, service tier,\
        \ and granted scopes."
      operationId: getV2Principal
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PrincipalResponse"
          description: Current API-key details
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "503":
          $ref: "#/components/responses/V2UsageUnavailable"
      security:
      - PlatformAPIKey: []
      summary: Read the current API key
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/usage:
    get:
      description: Returns the workspace-wide minute and UTC-day weighted unit budget
        shared by every key in the subscribed workspace. Per-operation request/unit/error
        counters remain attributed to the current API key. Calling this endpoint consumes
        one unit.
      operationId: getV2Usage
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetUsageResponse"
          description: Live Valkey-backed usage summary
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "503":
          $ref: "#/components/responses/V2UsageUnavailable"
      security:
      - PlatformAPIKey: []
      summary: Read live weighted Platform usage
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/audit/events:
    get:
      description: "Returns the workspace’s audit events in newest-first order, including\
        \ Platform settings and Steam automation events. Secret fields are removed\
        \ from nested metadata. Each event can store up to 32 KiB of metadata."
      operationId: listV2AuditEvents
      parameters:
      - explode: true
        in: query
        name: source
        required: false
        schema:
          enum:
          - platform
          - steam
          type: string
        style: form
      - explode: true
        in: query
        name: event_type
        required: false
        schema:
          pattern: "^[a-z][a-z0-9_.-]{1,79}$"
          type: string
        style: form
      - explode: true
        in: query
        name: resource_type
        required: false
        schema:
          pattern: "^[a-z][a-z0-9_.-]{1,79}$"
          type: string
        style: form
      - explode: true
        in: query
        name: outcome
        required: false
        schema:
          enum:
          - accepted
          - rejected
          - succeeded
          - failed
          - recorded
          type: string
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: Cursor returned by the previous page. Pass it back unchanged
          and with the same filters; otherwise the API returns 400.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ListAuditEventsResponse"
          description: Workspace-owned audit page
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Malformed or cross-filter cursor
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: The API key does not have audit:read
        "503":
          $ref: "#/components/responses/V2UsageUnavailable"
      security:
      - PlatformAPIKey: []
      summary: List workspace audit events
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/audit/exports:
    get:
      description: Returns audit export jobs in newest-first order.
      operationId: listV2AuditExports
      parameters:
      - explode: true
        in: query
        name: state
        required: false
        schema:
          enum:
          - queued
          - leased
          - completed
          - failed
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Cursor returned by the previous page. Pass it back unchanged
          and with the same state filter.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AuditExportPageResponse"
          description: Workspace-owned audit export page
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Invalid filter or cursor
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "503":
          $ref: "#/components/responses/V2UsageUnavailable"
      security:
      - PlatformAPIKey: []
      summary: List audit export jobs
      tags:
      - Platform v2
      x-openskin-availability: production
    post:
      description: "Queues a verified export of audit events in the requested time\
        \ range. The range must be in the past, use an inclusive start and exclusive\
        \ end, and span no more than 32 days."
      operationId: createV2AuditExport
      parameters:
      - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2CreateAuditExportRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AuditExportReceiptResponse"
          description: Idempotent replay returned the original job
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AuditExportReceiptResponse"
          description: Audit export job created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Invalid range or request document
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Idempotency key was reused with a different range
        "503":
          $ref: "#/components/responses/V2UsageUnavailable"
      security:
      - PlatformAPIKey: []
      summary: Create an audit export
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/audit/exports/{export_id}:
    get:
      description: "Returns one audit export job. A completed, unexpired export includes\
        \ a new short-lived HTTPS download URL."
      operationId: getV2AuditExport
      parameters:
      - explode: false
        in: path
        name: export_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AuditExportJobResponse"
          description: Workspace-owned audit export job
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Export is absent or belongs to another workspace
        "503":
          $ref: "#/components/responses/V2UsageUnavailable"
      security:
      - PlatformAPIKey: []
      summary: Read an audit export
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/items:
    get:
      description: Returns Steam Market item variants that use the cs2.market.v1 identity
        format. Treat catalog IDs and cursors as API-generated values and pass them
        back unchanged.
      operationId: listV2CatalogItems
      parameters:
      - description: Literal case-insensitive substring of market_hash_name.
        explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 120
          type: string
        style: form
      - explode: true
        in: query
        name: type
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: weapon
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: exterior
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: rarity
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: phase
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: stattrak
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: souvenir
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: definition_index
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - explode: true
        in: query
        name: paint_index
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: Cursor returned by the previous page. Omit it for the first page.
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ListCatalogItemsResponse"
          description: Catalog page
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Invalid filter or cursor
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Catalog or usage service unavailable
      security:
      - PlatformAPIKey: []
      summary: List CS2 catalog items
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/items/{catalog_id}:
    get:
      description: Returns the catalog item identified by a versioned catalog ID.
      operationId: getV2CatalogItem
      parameters:
      - explode: false
        in: path
        name: catalog_id
        required: true
        schema:
          pattern: "^cs2\\.market\\.v1\\.[A-Za-z0-9_-]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetCatalogItemResponse"
          description: Exact catalog variant
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Unsupported or malformed catalog identity
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Catalog item not found
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Catalog or usage service unavailable
      security:
      - PlatformAPIKey: []
      summary: Read a CS2 catalog item
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/collections:
    get:
      description: Returns CS2 collections and the source of each collection record.
        Current collection membership data comes from ByMykel CSGO-API.
      operationId: listV2CatalogCollections
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ListCatalogCollectionsResponse"
          description: Collection summaries
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
      security:
      - PlatformAPIKey: []
      summary: List CS2 collections
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/collections/{collection_id}:
    get:
      description: Returns one collection and its Steam Market item variants.
      operationId: getV2CatalogCollection
      parameters:
      - explode: false
        in: path
        name: collection_id
        required: true
        schema:
          pattern: "^cs2\\.collection\\.bymykel\\.v1\\.[A-Za-z0-9_-]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetCatalogCollectionResponse"
          description: Collection detail
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Unsupported collection identity
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Collection not found
      security:
      - PlatformAPIKey: []
      summary: Read a CS2 collection
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/containers:
    get:
      description: Returns CS2 containers and the number of imported regular and rare
        drops for each container.
      operationId: listV2CatalogContainers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ListCatalogContainersResponse"
          description: Container summaries
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
      security:
      - PlatformAPIKey: []
      summary: List CS2 containers
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/containers/{catalog_id}/contents:
    get:
      description: Returns the regular and rare item drops recorded for one container.
      operationId: getV2CatalogContainerContents
      parameters:
      - explode: false
        in: path
        name: catalog_id
        required: true
        schema:
          pattern: "^cs2\\.market\\.v1\\.[A-Za-z0-9_-]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetCatalogContainerContentsResponse"
          description: Container and drop relationships
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Unsupported catalog identity
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Container or imported contents not found
      security:
      - PlatformAPIKey: []
      summary: List a container's contents
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/currencies:
    get:
      description: Rates are expressed as units of the named currency per one USD
        and retain the Frankfurter observation timestamp.
      operationId: listV2CatalogCurrencies
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ListCatalogCurrenciesResponse"
          description: Current currency references
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
      security:
      - PlatformAPIKey: []
      summary: List decimal exchange-rate references
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/snapshot:
    get:
      description: Returns a SHA-256 digest and ETag for the current catalog state.
        The result represents one database transaction and is cached for five minutes.
      operationId: getV2CatalogSnapshot
      parameters:
      - explode: false
        in: header
        name: If-None-Match
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetCatalogSnapshotResponse"
          description: Current catalog snapshot
          headers:
            ETag:
              explode: false
              schema:
                type: string
              style: simple
        "304":
          description: The caller already has the current cached snapshot
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
      security:
      - PlatformAPIKey: []
      summary: Read current catalog state
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/releases/latest:
    get:
      description: Returns the latest release only after verifying its Ed25519 signature
        with the configured trusted key. A published release cannot be changed.
      operationId: getLatestV2CatalogRelease
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetLatestCatalogReleaseResponse"
          description: Latest verified release
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: No release has been published
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Release verification is not configured
      security:
      - PlatformAPIKey: []
      summary: Read the latest catalog release
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/releases/{release_id}:
    get:
      description: Returns the requested catalog release after verifying its signature.
      operationId: getV2CatalogRelease
      parameters:
      - explode: false
        in: path
        name: release_id
        required: true
        schema:
          pattern: "^cs2rel_[A-Za-z0-9_-]{43}$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetCatalogReleaseResponse"
          description: Verified signed release
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Release not found
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Release verification is not configured
      security:
      - PlatformAPIKey: []
      summary: Read a catalog release
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/releases/{release_id}/export:
    get:
      description: Returns a five-minute download URL for the signed release’s gzip-compressed
        NDJSON archive.
      operationId: getV2CatalogReleaseExport
      parameters:
      - explode: false
        in: path
        name: release_id
        required: true
        schema:
          pattern: "^cs2rel_[A-Za-z0-9_-]{43}$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetCatalogReleaseExportResponse"
          description: Verified archive receipt and temporary download URL
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Invalid catalog release identity
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "403":
          $ref: "#/components/responses/V2Forbidden"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: The signed release or its verified archive was not found
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Release verification or read-only object signing is unavailable
      security:
      - PlatformAPIKey: []
      summary: Download a catalog release
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/catalog/release-keys:
    get:
      description: Lists the public keys trusted to verify catalog releases.
      operationId: listV2CatalogReleaseKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ListCatalogReleaseKeysResponse"
          description: Configured public verification keys
        "401":
          $ref: "#/components/responses/V2Unauthorized"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Release verification is not configured
      security:
      - PlatformAPIKey: []
      summary: List catalog release verification keys
      tags:
      - Platform v2
      x-openskin-availability: production
  /v2/prices/{catalog_id}:
    get:
      description: "Returns current prices for one catalog item as decimal strings,\
        \ including source time and freshness. A version filter selects one stored\
        \ version; an unfiltered request returns every stored version."
      operationId: getV2CurrentPrices
      parameters:
      - explode: false
        in: path
        name: catalog_id
        required: true
        schema:
          pattern: "^cs2\\.market\\.v1\\.[A-Za-z0-9_-]+$"
          type: string
        style: simple
      - description: "Exact source pattern, phase, or tier. Omit to return all stored\
          \ versions."
        explode: true
        in: query
        name: version
        required: false
        schema:
          maxLength: 120
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2GetCurrentPricesResponse"
          description: Current source observations
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PlatformErrorResponse"
          description: Invalid catalog identity or version
