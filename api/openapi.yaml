        \ response includes execution state and assets, but not customer prices, credits,\
        \ or profit calculations."
      operationId: listV2TradeIntents
      parameters:
      - explode: true
        in: query
        name: account_id
        required: false
        schema:
          format: int64
          minimum: 1
          type: integer
        style: form
      - description: Comma-separated intent states
        explode: true
        in: query
        name: state
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: partner_steam_id64
        required: false
        schema:
          pattern: "^7656119[0-9]{10}$"
          type: string
        style: form
      - description: Exact opaque customer workflow reference
        explode: true
        in: query
        name: external_reference
        required: false
        schema:
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
